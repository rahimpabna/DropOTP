<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="navDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="navBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- LOGO ICON CONTAINER -->
  <g transform="translate(10, 8)">
    <!-- Squircle Frame -->
    <rect x="0" y="0" width="74" height="74" rx="18" fill="#0C1523" stroke="url(#navBorderGrad)" stroke-width="2.5"/>
    
    <!-- Droplet Shape -->
    <path d="M 37 14 C 37 14, 58 40, 58 49 A 21 21 0 1 1 16 49 C 16 40, 37 14, 37 14 Z" fill="url(#navDropGrad)"/>

    <!-- Inset Tech Envelope -->
    <g transform="translate(23, 40)">
      <rect x="0" y="0" width="28" height="19" rx="3.5" fill="#0B101B" opacity="0.95"/>
      <path d="M 2 2 L 14 11 L 26 2" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="14" r="1.6" fill="#34D399"/>
    </g>

    <!-- 4 Digital Verification Pins -->
    <circle cx="28" cy="33" r="1.8" fill="#FFFFFF"/>
    <circle cx="34" cy="33" r="1.8" fill="#FFFFFF"/>
    <circle cx="40" cy="33" r="1.8" fill="#FFFFFF"/>
    <circle cx="46" cy="33" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY / BRAND NAME -->
  <g transform="translate(98, 48)">
    <text x="0" y="4" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34px" letter-spacing="-0.8px" fill="#092C1E">
      Drop<tspan fill="#10B981">OTP</tspan>
    </text>
    
    <!-- Domain Extension Badge -->
    <g transform="translate(162, -22)">
      <rect x="0" y="0" width="48" height="22" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.2"/>
      <text x="9" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13px" fill="#059669">.com</text>
    </g>

    <!-- Tagline & Subtext -->
    <text x="2" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5px" letter-spacing="1.5px" fill="#3B6351">
      INSTANT EMAIL &amp; OTP RECEPTION
    </text>
  </g>
</svg>