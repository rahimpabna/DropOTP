version: '3.8'

services:
  # ==============================================================================
  # 1. PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: otp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-otp_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 300M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-otp_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. Redis Cache & Pub/Sub
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: otp_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_pass_123}
      --maxmemory 120mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 150M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 3. Backend API & Inbound SMTP Worker (Port 25)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: otp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:4000:4000" # Internal API & WebSocket port
      - "25:25"               # Public Inbound SMTP Catch-All Mail Server
    deploy:
      resources:
        limits:
          cpus: '1.20'
          memory: 450M
        reservations:
          memory: 200M

  # ==============================================================================
  # 4. Frontend Web App (React + Refine + Tailwind)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: otp_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 100M
        reservations:
          memory: 32M

  # ==============================================================================
  # 5. Caddy Edge Proxy (Automatic HTTPS SSL certificates)
  # ==============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: otp_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 80M
        reservations:
          memory: 32M

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
